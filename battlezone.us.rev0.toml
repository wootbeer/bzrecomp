text = "    bz_terrain_begin_anchored(rdram, &ctx->r12, ctx->f8.fl, ctx->f9.fl, ctx->f7.fl, (int32_t)ctx->r23, (int32_t)ctx->r11, (int32_t)ctx->r29, &ctx->r17, &ctx->r13);"

